name: Build Hexo site

on:
  pull_request:
    branches: [main]
    paths:
      - "blog-source/**"
      - "vercel.json"
      - ".github/workflows/hexo-build.yml"
  push:
    branches: [main]
    paths:
      - "blog-source/**"
      - "vercel.json"
      - ".github/workflows/hexo-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix blog-source
      - run: npm run build --prefix blog-source
      - name: Confirm generated home page and briefing
        run: |
          test -s blog-source/public/index.html
          test -s blog-source/public/2026/11/01/life-sciences-briefing/index.html
