<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f4"><meta name="description" content="图绎 Figlyph：让灵感自由发生的图片编辑器。绘制、排版、创作，轻松完成每一张作品。"><link rel="icon" href="/editor/favicon.svg?v=20261019-4" type="image/svg+xml"><title>图绎 Figlyph · 图片编辑器</title><link rel="stylesheet" href="/editor/editor.css?v=20261019-4">
</head>
<body>
<header class="app-header">
<a class="brand" href="/editor/" aria-label="图绎 Figlyph 首页"><span class="brand-mark"><img src="/editor/favicon.svg?v=20261019-4" width="38" height="38" alt=""></span><span>图绎<span class="brand-en">FIGLYPH</span></span></a><div class="header-divider"></div>
<div class="document-name"><input id="documentName" aria-label="作品名称" value="山野来信 · 灵感海报" maxlength="60"><span id="savedState"><span class="status-dot"></span>已自动保存</span></div>
<div class="header-actions"><button class="icon-button" id="undo" title="撤销 Ctrl / ⌘ Z" aria-label="撤销"></button><button class="icon-button" id="redo" title="重做 Ctrl / ⌘ Shift Z" aria-label="重做"></button><span class="header-divider"></span><button class="button quiet" id="projectMenu">文件</button><button class="button quiet" id="newProject">新建画布</button><button class="button primary" id="exportButton">导出图片 <span data-icon="arrowUpRight"></span></button></div>
</header>
<main class="app-body">
<nav class="tool-rail" aria-label="创作工具">
<button data-panel="elements" class="rail-button active"><span data-icon="shapes"></span><span>元素</span></button><button data-panel="text" class="rail-button"><span data-icon="type"></span><span>文字</span></button><button data-panel="images" class="rail-button"><span data-icon="image"></span><span>图片</span></button><button data-panel="layers" class="rail-button"><span data-icon="layers"></span><span>图层</span></button><div class="rail-spacer"></div><button id="helpButton" class="rail-button"><span data-icon="help"></span><span>帮助</span></button><div class="avatar" title="本地创作空间">S</div>
</nav>
<aside class="asset-panel" id="assetPanel" aria-label="素材面板"></aside>
<section class="workspace" aria-label="画布工作区">
<div class="workspace-toolbar"><div class="toolbar-group"><button class="tool-button active" id="selectTool" title="选择工具 V" aria-label="选择工具"><span data-icon="cursor"></span></button><button class="tool-button" id="marqueeTool" title="框选工具 M · 拖动选中框内元素" aria-label="框选工具"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="3 3"/></svg></button><button class="tool-button" id="regionTool" title="区域清除 R · 框选后按 Delete 填充背景色" aria-label="区域清除工具"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1" stroke-dasharray="3 3"/><path d="m8 14 5-5 4 4-5 5H8zM12 18h6"/></svg></button><button class="tool-button" id="handTool" title="移动画布 H / 按住空格" aria-label="移动画布"><span data-icon="hand"></span></button><span class="tiny-divider"></span><button class="tool-button" id="brushTool" title="自由画笔 B" aria-label="自由画笔"><span data-icon="pen"></span></button><select id="marqueeMode" class="marquee-mode" aria-label="框选方式"><option value="intersect">接触即选</option><option value="contain">完全包含</option></select><input type="color" id="brushColor" value="#d77552" aria-label="画笔颜色" title="画笔颜色"><input type="number" id="brushWidth" min="1" max="100" value="8" aria-label="画笔粗细" title="画笔粗细"></div><button class="canvas-size" id="canvasSettings"><span data-icon="frame"></span><span id="sizeLabel">800 × 1000 px</span><span data-icon="chevronDown"></span></button><button id="propertiesToggle" class="mobile-properties" aria-label="显示或隐藏属性面板">属性 <span data-icon="chevronDown"></span></button><span class="workspace-label">你的灵感，自由生长</span></div>
<div class="canvas-viewport" id="viewport"><div class="canvas-ruler horizontal" aria-hidden="true"></div><div class="canvas-ruler vertical" aria-hidden="true"></div><div class="artboard-wrap" id="artboardWrap"><canvas id="artboard" width="800" height="1000" aria-label="作品画布，可使用图层面板和右侧属性编辑对象" tabindex="0"></canvas><div id="regionSelection" class="region-selection" aria-hidden="true"></div><div id="marqueeSelection" aria-hidden="true"></div><div id="textRangeOverlay" class="text-range-overlay" aria-hidden="true"></div><div class="selection-overlay" id="selectionOverlay"><div class="selection-box" id="selectionBox"><div class="rotation-stem"></div><button data-handle="rotate" class="rotate-handle" aria-label="旋转对象"></button><button data-handle="nw" class="resize-handle nw" aria-label="从左上角缩放"></button><button data-handle="ne" class="resize-handle ne" aria-label="从右上角缩放"></button><button data-handle="sw" class="resize-handle sw" aria-label="从左下角缩放"></button><button data-handle="se" class="resize-handle se" aria-label="从右下角缩放"></button><div class="selection-size" id="selectionSize"></div></div></div><div id="inlineText" contenteditable="true" role="textbox" aria-multiline="true" aria-label="编辑文字内容" spellcheck="false"></div></div><div id="regionHint" class="region-hint">拖动选择区域 · Delete 填充为背景色 · Esc 取消</div><div id="drawingHint" class="drawing-hint" role="status"></div><div id="marqueeHint" class="marquee-hint">选框触及元素即可选中 · Shift 追加选择</div><div class="drop-hint">松开鼠标，让图片加入创作</div></div>
<div class="workspace-footer"><span><span class="live-dot"></span><span id="layerCount">8 个图层</span><span class="footer-separator">/</span><span>本地创作空间</span></span><div class="zoom-controls"><button id="zoomOut" aria-label="缩小">−</button><button id="zoomValue" title="恢复适合画布">50%</button><button id="zoomIn" aria-label="放大">+</button><span class="tiny-divider"></span><button id="fitCanvas" title="适合画布" aria-label="适合画布"><span data-icon="maximize"></span></button></div></div>
</section>
<aside class="inspector" id="inspector" aria-label="对象属性"></aside>
</main>
<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2" hidden><input type="file" id="projectInput" accept=".json,.figlyph,.shiguang" hidden><div id="toast" class="toast" role="status"></div><dialog id="modal"><div id="modalContent"></div></dialog><script type="module" src="/editor/editor.js?v=20261019-4"></script>
</body></html>
